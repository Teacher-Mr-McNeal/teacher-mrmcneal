<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to Instagram</title>

  <!-- Google Analytics tag (replace G-XXXXXXX with your Measurement ID) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QM7VHPKQXD"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-XXXXXXX');
  </script>

  <!-- Redirect after short delay -->
  <script>
    setTimeout(function(){
      // Track the redirect as an event
      gtag('event', 'click', {
        'event_category': 'outbound',
        'event_label': 'Instagram Redirect'
      });

      // Perform the redirect
      window.location.href = "https://instagram.com/teachermrmcneal";
    }, 600);
  </script>
</head>
<body>
  <p>Redirecting you to Instagram…</p>
  <p>If not redirected, 
    <a href="https://instagram.com/teachermrmcneal"
       onclick="gtag('event', 'click', {
         'event_category': 'outbound',
         'event_label': 'Instagram Link'
       });">
       click here
    </a>.
  </p>
</body>
</html>
